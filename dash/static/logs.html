<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1017" />
    <meta name="description" content="Live service logs for the trader system." />
    <title>Trader — Service logs</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/common.js" defer></script>
    <script src="/header.js" defer></script>
    <script src="/logs.js" defer></script>
  </head>
  <body class="logs-page">
    <a class="skip-link" href="#main">Skip to logs</a>

    <header class="topbar">
      <div class="trader-menu">
        <button class="brand" id="trader-menu-button" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="trader-menu-dropdown">
          <span class="brand-mark market-status-mark" id="market-dot" aria-hidden="true"><i></i><i></i><i></i></span>
          <span>TRADER</span>
          <span class="brand-chevron" aria-hidden="true">⌄</span>
        </button>
        <span class="market-status-copy" id="market-status" role="status" aria-label="Checking market"></span>
        <div class="trader-menu-dropdown" id="trader-menu-dropdown" aria-label="Trader menu" hidden>
          <small>Services</small>
          <div class="menu-health-list" aria-label="Live service health">
            <div class="health-indicator is-checking" id="health-bars">
              <span class="health-indicator-dot" aria-hidden="true"></span>
              <span class="health-indicator-copy">
                <small>Bars</small>
                <strong id="health-bars-status">Checking</strong>
              </span>
              <span class="health-indicator-detail" id="health-bars-detail" hidden>Waiting for response</span>
            </div>
            <div class="health-indicator is-checking" id="health-algo">
              <span class="health-indicator-dot" aria-hidden="true"></span>
              <span class="health-indicator-copy">
                <small>Algo</small>
                <strong id="health-algo-status">Checking</strong>
              </span>
              <span class="health-indicator-detail" id="health-algo-detail" hidden>Waiting for response</span>
            </div>
          </div>
        </div>
      </div>
      <nav class="topbar-nav" aria-label="Dashboard views">
        <a href="/" data-dashboard-view="chart">Chart</a>
        <a href="/algos" data-dashboard-view="algos">Algos</a>
        <a href="/trades" data-dashboard-view="trades">Trade</a>
        <a class="active" href="/logs" aria-current="page">Logs</a>
      </nav>
      <div class="topbar-meta" aria-hidden="true"></div>
    </header>

    <main id="main" class="logs-main">
      <section class="log-surface surface" aria-label="Service log entries">
        <div class="log-toolbar">
          <div class="log-filters">
            <label>
              <span>Service</span>
              <select id="service-filter">
                <option value="">All services</option>
              </select>
            </label>
            <label>
              <span>Level</span>
              <select id="level-filter">
                <option value="">All levels</option>
                <option value="info">Info</option>
                <option value="warn">Warning</option>
                <option value="error">Error</option>
              </select>
            </label>
            <label>
              <span>Rows</span>
              <select id="limit-filter">
                <option value="100">100</option>
                <option value="250" selected>250</option>
                <option value="500">500</option>
                <option value="1000">1,000</option>
              </select>
            </label>
          </div>
          <div class="log-toolbar-meta">
            <span class="shown-count" id="shown-count">Loading logs…</span>
            <div class="log-counts" role="group" aria-label="Log totals">
              <span><small>Total</small><strong id="count-total">—</strong></span>
              <span><small>Info</small><strong id="count-info">—</strong></span>
              <span class="warn"><small>Warn</small><strong id="count-warn">—</strong></span>
              <span class="error"><small>Error</small><strong id="count-error">—</strong></span>
            </div>
          </div>
        </div>

        <div class="log-table-head" aria-hidden="true">
          <span>Time</span>
          <span>Level</span>
          <span>Service</span>
          <span>Message</span>
        </div>
        <div class="log-list" id="log-list" aria-live="polite">
          <div class="logs-loading"><span></span>Loading service logs</div>
        </div>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>
