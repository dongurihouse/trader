<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1017" />
    <meta name="description" content="A read-only minute-bar chart for the trader system." />
    <title>Trader — Market chart</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to chart</a>

    <header class="topbar">
      <a class="brand" href="/" aria-label="Trader chart home">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span>TRADER</span>
      </a>
      <div class="topbar-meta">
        <span class="header-market">
          <span class="status-dot" id="market-dot"></span>
          <span id="market-label">Checking market</span>
          <span id="market-time"></span>
        </span>
        <span class="readonly-pill"><span aria-hidden="true">◇</span> Read only</span>
        <span class="updated" id="updated-at">Connecting…</span>
        <button class="icon-button" id="refresh-button" type="button" aria-label="Refresh chart">
          <span aria-hidden="true">↻</span>
        </button>
      </div>
    </header>

    <main id="main" class="chart-only-main">
      <section class="ticker-rail" id="ticker-rail" aria-label="Tracked tickers">
        <div class="ticker-skeleton"></div>
        <div class="ticker-skeleton"></div>
        <div class="ticker-skeleton"></div>
      </section>

      <section class="chart-card surface" aria-labelledby="chart-title">
        <div class="chart-header">
          <div class="quote-block">
            <div class="symbol-row">
              <h1 id="chart-title">—</h1>
              <span class="exchange-label">US EQUITY</span>
            </div>
            <div class="quote-row">
              <strong id="quote-price">—</strong>
              <span id="quote-change">—</span>
            </div>
          </div>
          <div class="range-control" id="range-control" aria-label="Chart range">
            <button type="button" data-range="1D">1D</button>
            <button type="button" data-range="5D">5D</button>
            <button type="button" data-range="1M">1M</button>
            <button type="button" data-range="ALL" class="active">All</button>
          </div>
        </div>

        <div class="chart-summary" aria-live="polite">
          <span><small>OPEN</small><b id="stat-open">—</b></span>
          <span><small>HIGH</small><b id="stat-high">—</b></span>
          <span><small>LOW</small><b id="stat-low">—</b></span>
          <span><small>VOLUME</small><b id="stat-volume">—</b></span>
          <span class="chart-density"><small>VIEW</small><b id="stat-density">—</b></span>
        </div>

        <div class="chart-stage" id="chart-stage">
          <canvas id="price-chart" role="img" aria-label="Minute price chart"></canvas>
          <div class="chart-tooltip" id="chart-tooltip" hidden></div>
          <div class="chart-loading" id="chart-loading">
            <span></span>
            Loading market data
          </div>
          <div class="chart-empty" id="chart-empty" hidden>
            <strong>No bars yet</strong>
            <span>This chart will fill when the bars service stores data.</span>
          </div>
        </div>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>
