<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1017" />
    <meta name="description" content="A read-only minute-bar chart for the trader system." />
    <title>Trader — Market chart</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to chart</a>

    <header class="topbar">
      <div class="trader-menu">
        <button class="brand" id="trader-menu-button" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="trader-menu-dropdown">
          <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
          <span>TRADER</span>
          <span class="brand-chevron" aria-hidden="true">⌄</span>
        </button>
        <div class="trader-menu-dropdown" id="trader-menu-dropdown" role="menu" aria-label="Chart display" hidden>
          <small>Chart style</small>
          <button type="button" role="menuitemradio" data-style="line" aria-checked="true">
            <span class="menu-style-icon line" aria-hidden="true"></span>
            Line
          </button>
          <button type="button" role="menuitemradio" data-style="candles" aria-checked="false">
            <span class="menu-style-icon candles" aria-hidden="true"></span>
            Candles
          </button>
        </div>
      </div>
      <nav class="topbar-nav" aria-label="Dashboard views">
        <a class="active" href="/" aria-current="page">Chart</a>
        <a href="/logs">Logs</a>
      </nav>
      <div class="topbar-meta">
        <span class="header-market">
          <span class="status-dot" id="market-dot"></span>
          <span id="market-label">Checking market</span>
          <span id="market-time"></span>
        </span>
        <span class="updated" id="updated-at">Connecting…</span>
      </div>
    </header>

    <main id="main" class="chart-only-main">
      <section class="ticker-rail" id="ticker-rail" aria-label="Tracked tickers">
        <div class="ticker-skeleton"></div>
        <div class="ticker-skeleton"></div>
        <div class="ticker-skeleton"></div>
      </section>

      <section class="date-rail" aria-label="Trading dates">
        <div class="date-strip" id="date-strip" role="group" aria-label="Focus chart on a trading date">
          <span class="date-strip-loading">Loading dates…</span>
        </div>
      </section>

      <section class="chart-card surface" aria-label="Price chart">
        <div class="chart-header">
          <div class="quote-block">
            <div class="quote-row">
              <strong id="quote-price">—</strong>
              <span id="quote-change">—</span>
            </div>
          </div>
        </div>

        <div class="chart-legend-row" id="algo-overlay" aria-live="polite" hidden>
          <div class="chart-legend" aria-label="Algorithm trade overlay">
            <span class="algo-overlay-name"><small>ALGO</small><strong id="algo-overlay-name">—</strong></span>
            <span id="algo-range-legend"><i class="legend-range" aria-hidden="true"></i><span id="algo-range-label">Opening range</span></span>
            <span><i class="legend-entry" aria-hidden="true"></i> Entry</span>
            <span><i class="legend-exit" aria-hidden="true"></i> Exit</span>
          </div>
          <span class="algo-overlay-count" id="algo-overlay-count">Checking actions…</span>
        </div>

        <div class="chart-stage" id="chart-stage">
          <canvas id="price-chart" role="img" aria-label="Minute price chart" title="Choose a date above, scroll horizontally, or drag to pan. Scroll vertically to zoom."></canvas>
          <div class="chart-tooltip" id="chart-tooltip" hidden></div>
          <div class="chart-loading" id="chart-loading">
            <span></span>
            Loading market data
          </div>
          <div class="chart-empty" id="chart-empty" hidden>
            <strong>No bars yet</strong>
            <span>This chart will fill when the bars service stores data.</span>
          </div>
        </div>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>
