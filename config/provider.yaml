# trader — data provider
vendor: robinhood-mcp        # sole ongoing vendor (Dev ruling 2026-07-31, carried forward)

relay:
  # Headless fetch through the Claude CLI MCP relay; requires the robinhood-trading
  # MCP server to be authenticated in an interactive session first.
  claude_bin: claude
  tool: mcp__robinhood-trading__get_equity_historicals

granularities:
  minute_history_days: 40    # measured vendor sliding window for 1m bars
  daily_history: unlimited

validation:
  # ETF/underlying leverage relation check at ingest (SNXX/SNDQ are +-2x SNDK).
  etf_leverage_factor: 2.0
  etf_tolerance: 0.25
  # Bad-tick policy is normative in docs/design/architecture.md §10a (amendment A9):
  # a bad tick is a SHORT excursion that RETURNS to the prior level. A level that shifts
  # and stays is a regime change and is never quarantined, however large.
  # (Origin: SNDK 2026-07-16 16:27Z printed 1615.00 against a 1430-1442 tape.)
  #
  # How far a run's high AND low must depart from the agreed surrounding level, and how
  # closely the levels before and after the run must agree with each other.
  bad_tick_neighbor_fraction: 0.05
  # Longest run still treatable as a glitch. A longer suspect run is NEVER deleted — it
  # is escalated as a validation error for the Dev to judge.
  max_bad_run_bars: 3
  # Backstop cap on total quarantine per (symbol, day), measured against the original
  # frame size. Exceeding it aborts quarantining for that day and records a validation
  # error. Rules 2-4 of §10a should make this unreachable in normal operation.
  quarantine_abort_fraction: 0.05
