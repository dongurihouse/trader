# trader — data provider
vendor: robinhood-mcp        # sole ongoing vendor (Dev ruling 2026-07-31, carried forward)

relay:
  # Headless fetch through the Claude CLI MCP relay; requires the robinhood-trading
  # MCP server to be authenticated in an interactive session first.
  claude_bin: claude
  tool: mcp__robinhood-trading__get_equity_historicals

granularities:
  minute_history_days: 40    # measured vendor sliding window for 1m bars
  daily_history: unlimited

validation:
  # ETF/underlying leverage relation check at ingest (SNXX/SNDQ are +-2x SNDK).
  etf_leverage_factor: 2.0
  etf_tolerance: 0.25
  # Single-bar sanity: quarantine bars whose high/low deviate from both neighbors
  # by more than this fraction (bad-tick lesson: SNDK 2026-07-16 16:27Z printed 1615.00
  # against a 1430-1442 tape in the predecessor store).
  bad_tick_neighbor_fraction: 0.05
