# trader — algo roster and global gates
#
# Ported from dt's rules/rules.yaml v1.6 (gates) and rules/algos.yaml roster
# v1.2 (3 emitting + 5 probe setups). Every number here traces to one of
# those two files; see the citation on each value below. No placeholder values
# remain.
#
# Schema consumed by trader.algos.declarative.DeclarativeAlgo: each roster
# entry's `params` is the FULL per-setup definition (dt split this across
# rules/algos.yaml's one entry plus the shared rules/rules.yaml gates; here
# both live together because contracts.AlgoSpec has only one `params` dict).
# YAML anchors (&name / *name) keep each shared number and the whole gates
# list defined exactly once and referenced by every roster entry, replacing
# dt's code-side value_ref/SHARED_CONSTANTS indirection (this project has no
# runtime parameter-sweep tool, so an anchor is sufficient -- see
# src/trader/algos/rules.py's module docstring for why value_ref itself was
# dropped from the grammar). One exception: YAML aliases cannot negate a
# value, so dir-gap-go-short's clause below states the negated gap_min_pct
# threshold (-2.0) as its own literal, with a comment tying it back to
# *gap_min_pct -- if gap_min_pct ever changes, this literal must be updated
# by hand alongside it.

rules_version: &rules_version "v1.6-trader"   # dt rules/rules.yaml: version: "v1.6"

# dt/engine/risk.py:25 ENTRY_CUTOFF_MINUTES_BEFORE_CLOSE = 30. Shared by the
# veto-entry-cutoff gate below and by DeclarativeAlgo's phase_at derivation
# (the "closed" boundary) for every roster entry.
entry_cutoff_minutes_before_close: &entry_cutoff_minutes_before_close 30

# dt/rules/algos.yaml gap_play.params.gap_min_pct = 2.0 -- the one number
# dt's rules.yaml value_ref/SHARED_CONSTANTS mechanism shared between the
# gap_play setup and the dir-gap-go-long/short gates.
gap_min_pct: &gap_min_pct 2.0

known_algo_ids: &known_algo_ids
  - orb5
  - gap_play
  - lateday_momentum
  - opening_momentum
  - day_extreme_reversal
  - first_pullback
  - prior_level_breakout
  - range_compression

# dt/rules/rules.yaml v1.6, six rules, unchanged order/ids/roles.
gates: &gates
  - id: gate-in-play
    role: gate
    # v1.6 (T18, Dev-ratified 2026-08-01): threshold 2.0 -> 1.0. "is this
    # session busier than its own baseline at all."
    source: rvol_open_30m
    operator: ">"
    value: 1.0
  - id: veto-entry-cutoff
    role: veto
    source: minutes_to_close
    operator: "<"
    value: *entry_cutoff_minutes_before_close
  - id: dir-gap-go-long
    role: direction
    direction: long
    all:
      - {source: gap_pct, operator: ">", value: *gap_min_pct}
      - {source: open_vs_prior_high, operator: ">", value: 0}
  - id: dir-gap-go-short
    role: direction
    direction: short
    all:
      # Negated *gap_min_pct (2.0); YAML aliases cannot negate, see header note.
      - {source: gap_pct, operator: "<", value: -2.0}
      - {source: open_vs_prior_low, operator: "<", value: 0}
  - id: conf-tape-agree
    role: confirmation
    # v1.5 ADOPTED: direction-aware via relative_to + mirror (this port's
    # replacement for dt's signal_registry.mirror_of lookup, since algos
    # cannot import the provider's registry -- see rules.py).
    source: peer_above_vwap_count
    mirror: peer_below_vwap_count
    relative_to: candidate_direction
    operator: ">="
    value: 3
  - id: conf-vwap-trend
    role: confirmation
    source: vwap_side_run_minutes
    operator: "abs>"
    value: 30

roster:
  # ---- emitting -----------------------------------------------------------
  - id: orb5
    factory: "trader.algos.declarative:DeclarativeAlgo"
    status: emitting
    params:
      values:
        or_minutes: 5
        target_r: 2.0
      phases: [open]
      minute_window: {min_param: or_minutes}
      one_shot: true
      trigger: null
      sides:
        - direction: long
          when: {all: [{source: price, operator: ">", value_signal: "or{or_minutes}_high"}]}
        - direction: short
          when: {all: [{source: price, operator: "<", value_signal: "or{or_minutes}_low"}]}
      bracket:
        entry: price
        stop: {formula: structural_or, window_param: or_minutes}
        target: {formula: r_multiple, r_param: target_r}
      entry_cutoff_minutes_before_close: *entry_cutoff_minutes_before_close
      rules_version: *rules_version
      gates: *gates
      known_algo_ids: *known_algo_ids

  - id: gap_play
    factory: "trader.algos.declarative:DeclarativeAlgo"
    status: emitting
    params:
      values:
        confirm_minutes: 15
        gap_min_pct: *gap_min_pct
        risk_atr_frac: 0.25
        target_r: 2.0
      phases: [open]
      minute_window: {min_param: confirm_minutes}
      one_shot: true
      trigger: null
      sides:
        - direction: long
          when:
            all:
              - {source: gap_pct, operator: ">", value_param: gap_min_pct}
              - {source: open_vs_prior_high, operator: ">", value: 0}
              - {source: price, operator: ">", value_signal: "or{confirm_minutes}_high"}
        - direction: short
          when:
            all:
              - {source: gap_pct, operator: "<", value_param: "-gap_min_pct"}
              - {source: open_vs_prior_low, operator: "<", value: 0}
              - {source: price, operator: "<", value_signal: "or{confirm_minutes}_low"}
      bracket:
        entry: price
        stop: {formula: atr_frac, frac_param: risk_atr_frac}
        target: {formula: r_multiple, r_param: target_r}
      entry_cutoff_minutes_before_close: *entry_cutoff_minutes_before_close
      rules_version: *rules_version
      gates: *gates
      known_algo_ids: *known_algo_ids

  - id: lateday_momentum
    factory: "trader.algos.declarative:DeclarativeAlgo"
    status: emitting
    params:
      values:
        first30_min_pct: 1.0
        risk_atr_frac: 0.15
        target_r: 1.5
      phases: [late]
      one_shot: true
      trigger: {all: [{source: first30_ret, operator: "abs>=", value_param: first30_min_pct}]}
      sides:
        - direction: {sign_of: first30_ret}
      bracket:
        entry: price
        stop: {formula: atr_frac, frac_param: risk_atr_frac}
        target: {formula: r_multiple, r_param: target_r}
      entry_cutoff_minutes_before_close: *entry_cutoff_minutes_before_close
      rules_version: *rules_version
      gates: *gates
      known_algo_ids: *known_algo_ids

  # ---- probes (silent only; status "probe" -- shadow book only) -----------
  - id: opening_momentum
    factory: "trader.algos.declarative:DeclarativeAlgo"
    status: probe
    params:
      values:
        min_minutes: 10
        max_minutes: 45
        impulse_pct: 1.5
        risk_atr_frac: 0.2
        target_r: 2.0
      phases: [open]
      minute_window: {min_param: min_minutes, max_param: max_minutes}
      one_shot: true
      trigger: {all: [{source: ret_from_open, operator: "abs>=", value_param: impulse_pct}]}
      sides:
        - direction: {sign_of: ret_from_open}
      bracket:
        entry: price
        stop: {formula: atr_frac, frac_param: risk_atr_frac}
        target: {formula: r_multiple, r_param: target_r}
      entry_cutoff_minutes_before_close: *entry_cutoff_minutes_before_close
      rules_version: *rules_version
      gates: *gates
      known_algo_ids: *known_algo_ids

  - id: day_extreme_reversal
    factory: "trader.algos.declarative:DeclarativeAlgo"
    status: probe
    params:
      values:
        min_minutes: 60
        min_range_atr: 0.75
        stop_atr_frac: 0.35
        target_r: 1.5
      phases_except: [closed]
      minute_window: {min_param: min_minutes}
      one_shot: true
      trigger: {all: [{source: day_range_atr, operator: ">=", value_param: min_range_atr}]}
      sides:
        - direction: long
          when: {all: [{source: new_day_low, operator: ">", value: 0}]}
        - direction: short
          when: {all: [{source: new_day_high, operator: ">", value: 0}]}
      bracket:
        entry: price
        stop: {formula: extreme_offset, frac_param: stop_atr_frac}
        target: {formula: r_multiple, r_param: target_r}
      entry_cutoff_minutes_before_close: *entry_cutoff_minutes_before_close
      rules_version: *rules_version
      gates: *gates
      known_algo_ids: *known_algo_ids

  - id: first_pullback
    factory: "trader.algos.declarative:DeclarativeAlgo"
    status: probe
    params:
      values:
        min_minutes: 30
        trend_min: 20
        pullback_band_pct: 0.15
        risk_atr_frac: 0.15
        target_r: 2.0
      phases: [open, morning]
      minute_window: {min_param: min_minutes}
      one_shot: true
      trigger:
        all:
          - {source: vwap_side_run_minutes, operator: "abs>=", value_param: trend_min}
          - {source: vwap_dist_pct, operator: "<=", value_param: pullback_band_pct}
      sides:
        - direction: {sign_of: vwap_side_run_minutes}
      bracket:
        entry: price
        stop: {formula: vwap_offset, frac_param: risk_atr_frac}
        target: {formula: r_multiple, r_param: target_r}
      entry_cutoff_minutes_before_close: *entry_cutoff_minutes_before_close
      rules_version: *rules_version
      gates: *gates
      known_algo_ids: *known_algo_ids

  - id: prior_level_breakout
    factory: "trader.algos.declarative:DeclarativeAlgo"
    status: probe
    params:
      values:
        min_minutes: 15
        risk_atr_frac: 0.2
        target_r: 2.0
      phases_except: [closed]
      minute_window: {min_param: min_minutes}
      one_shot: true
      trigger: null
      sides:
        - direction: long
          when:
            all:
              - {source: open_vs_prior_high, operator: "<", value: 0}
              - {source: price_vs_prior_high, operator: ">", value: 0}
        - direction: short
          when:
            all:
              - {source: open_vs_prior_low, operator: ">", value: 0}
              - {source: price_vs_prior_low, operator: "<", value: 0}
      bracket:
        entry: price
        stop: {formula: atr_frac, frac_param: risk_atr_frac}
        target: {formula: r_multiple, r_param: target_r}
      entry_cutoff_minutes_before_close: *entry_cutoff_minutes_before_close
      rules_version: *rules_version
      gates: *gates
      known_algo_ids: *known_algo_ids

  - id: range_compression
    factory: "trader.algos.declarative:DeclarativeAlgo"
    status: probe
    params:
      values:
        range_minutes: 60
        comp_atr_frac: 0.35
        target_r: 2.0
      phases: [lunch, late]
      minute_window: {min_param: range_minutes}
      one_shot: true
      trigger:
        all:
          - source: "or{range_minutes}_range"
            operator: "<="
            value_signal: atr_px
            value_scale_param: comp_atr_frac
      sides:
        - direction: long
          when: {all: [{source: price, operator: ">", value_signal: "or{range_minutes}_high"}]}
        - direction: short
          when: {all: [{source: price, operator: "<", value_signal: "or{range_minutes}_low"}]}
      bracket:
        entry: price
        stop: {formula: structural_or, window_param: range_minutes}
        target: {formula: r_multiple, r_param: target_r}
      entry_cutoff_minutes_before_close: *entry_cutoff_minutes_before_close
      rules_version: *rules_version
      gates: *gates
      known_algo_ids: *known_algo_ids
